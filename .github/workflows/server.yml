name: Server

# Builds the session server in server/ and runs its Zig tests and its bats
# tests where it runs: macOS, Linux x86_64 and Linux aarch64. On macOS it also
# checks the files that the protocol schema makes (scripts/protocol.sh). The
# builds that the app bundles come from server-build.yml.
#
# The three Test checks are required on main, and a required check must report
# on every pull request. So the workflow starts on every pull request and every
# push to main, and each Test job skips its steps when the commit changes no
# file of the `server` area of .github/path-areas (the job Detect Changes).
# The skip is at step level: a matrix job that a job-level if: skips reports
# its unexpanded name, which never matches the required name. A Test job that
# skips its steps runs on a 2 vCPU Linux runner, so it takes no macOS runner.
#
# macOS runs on macos-26 with Xcode 26.3: zig cannot link with Xcode 26.4 or
# later (zig#31658), and the macOS 27 runner has nothing older.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: server-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      server: ${{ steps.changes.outputs.server }}
    steps:
      # Depth 2: the merge commit of the pull request and its two parents.
      - uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 2
      - name: Find Server Changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: scripts/changed-areas.sh

  test:
    name: Test (${{ matrix.name }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-26
          # 4 vCPU, not 2 like the light jobs: Zig compiles with every core,
          # so 2 vCPU takes about twice as long for about the same billed
          # vCPU-minutes, and aarch64 is already the slowest required check.
          - name: Linux x86_64
            runner: blacksmith-4vcpu-ubuntu-2404
          - name: Linux aarch64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
    runs-on: ${{ needs.changes.outputs.server == 'true' && matrix.runner || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    env:
      SERVER: ${{ needs.changes.outputs.server }}
    steps:
      - uses: actions/checkout@v7
        if: env.SERVER == 'true'
        with:
          fetch-depth: 2

      - name: Select Xcode
        if: env.SERVER == 'true' && runner.os == 'macOS'
        uses: ./.github/actions/select-xcode
        with:
          version: "26.3"

      - name: Zig Version
        if: env.SERVER == 'true'
        id: zig
        working-directory: .
        run: echo "version=$(scripts/build-server.sh zig-version)" >> "$GITHUB_OUTPUT"

      # The cache of setup-zig is off: it saves the cache also from a job that
      # failed or that a newer push cancelled. Run 42760283476 restored such a
      # cache, which named an output file that was not in it. The steps below
      # save the cache only after a build that passed. The key changes only
      # when build.zig.zon or the Zig version changes, so each key is saved once.
      - name: Install Zig
        if: env.SERVER == 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}
          use-cache: false

      - name: Restore the Zig Cache
        if: env.SERVER == 'true'
        id: zig-cache
        uses: actions/cache/restore@v6
        with:
          path: .zig-cache
          key: server-zig-${{ matrix.runner }}-${{ runner.arch }}-${{ steps.zig.outputs.version }}-${{ hashFiles('server/build.zig.zon') }}
          restore-keys: |
            server-zig-${{ matrix.runner }}-${{ runner.arch }}-${{ steps.zig.outputs.version }}-

      - name: Fetch the Zig Packages
        if: env.SERVER == 'true'
        run: ../scripts/server-zig.sh fetch

      # host_install.bats runs its own sshd as the runner's user. macOS has
      # one at /usr/sbin/sshd.
      - name: Install Bats and sshd
        if: env.SERVER == 'true'
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install bats-core
          else
            sudo apt-get update -q
            sudo apt-get install -y -q bats openssh-server
          fi

      - name: Run the Zig Tests
        if: env.SERVER == 'true'
        run: ../scripts/server-zig.sh build test --summary all

      # The fuzz target for the packet parser of the roaming link (design/009).
      # A forged packet must never open, and must never move the window.
      # macOS only: on Linux, Zig 0.17.1 stops with "corrupted coverage file …
      # pcs_len was zero" (run 132269908310). The unit tests of the parser run
      # on every leg.
      - name: Fuzz the Link Packet Parser
        if: env.SERVER == 'true' && runner.os == 'macOS'
        run: ../scripts/server-zig.sh build fuzz-link --fuzz=500K

      - name: Build
        if: env.SERVER == 'true'
        run: ../scripts/server-zig.sh build

      # Only after a build that passed (the default if: is success()), and
      # only for a new key.
      - name: Save the Zig Cache
        if: env.SERVER == 'true' && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .zig-cache
          key: ${{ steps.zig-cache.outputs.cache-primary-key }}

      # The Swift side of the protocol is generated from the Zig schema
      # (design/003 §3). This step fails in these cases:
      # - a generated file is not current, or someone edited it;
      # - the schema breaks the add-only rule against the metadata on main
      #   or of the latest release, or adds to a released level;
      # - a message gets or loses a sender (design/006 §2);
      # - a reply or an event holds a secret (design/006 §1).
      - name: Check the Generated Protocol Files
        if: env.SERVER == 'true' && runner.os == 'macOS'
        working-directory: .
        run: |
          git fetch --no-tags --depth=1 origin main
          PROTOCOL_BASE=FETCH_HEAD scripts/protocol.sh --check
          git fetch --no-tags --depth=1 --filter=blob:none origin 'refs/tags/v*:refs/tags/v*'
          scripts/protocol.sh --check --base-release

      # A skipped test fails the step, so a missing tool cannot hide a test.
      # daemon_responsibility.bats tests a macOS concept, so Linux leaves it
      # out. The short TMPDIR keeps the socket paths under the macOS limit of
      # 104 bytes.
      - name: Run the Bats Tests
        if: env.SERVER == 'true'
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          files=()
          for f in test/*.bats; do
            if [ "$RUNNER_OS" != macOS ] && [ "$f" = test/daemon_responsibility.bats ]; then
              continue
            fi
            files+=("$f")
          done
          bats --tap "${files[@]}" | tee bats.tap
          if grep -qE '^ok [0-9]+ .* # skip' bats.tap; then
            echo "::error::A bats test was skipped."
            exit 1
          fi
