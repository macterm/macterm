name: Server Build

# Builds the session server from server/ for every target that the app
# carries (scripts/build-server.sh: macOS universal, Linux x86_64 and aarch64)
# and gives the tarballs to the calling workflow as the artifact `server`. A
# job that builds the app downloads it into build/server before setup, and
# setup installs it from there.
#
# The build key is the hash of the server's sources (build-server.sh). Each
# build has a manifest, `macterm-<key>-server.json`, with the SHA-256 of each
# tarball; `build-server.sh verify` checks a build against it.
# With the input `prebuilt`, the Linux job Find Prebuilt downloads the build
# of the key from the `server-prebuilt` release. When it finds the build, the
# macOS job Build does not run. Thus a commit that changes no server source
# takes no macOS runner. Without the input (the release workflows), Build
# always builds from the commit.
#
# A build that this job made goes to the `server-prebuilt` release, so that
# setup on a Mac without Zig can download it. An asset is never replaced. A
# pull request from a fork has a read-only token and uploads nothing.
# server-prebuilt-prune.yml removes old builds.
#
# macos-26 with Xcode 26.3: lipo needs macOS, and zig cannot link with Xcode
# 26.4 or later (zig#31658). The macOS 27 runner has nothing older.

on:
  workflow_call:
    inputs:
      prebuilt:
        description: Take the prebuilt for the key when the release has it.
        type: boolean
        default: true
      ref:
        description: The commit to build. Empty means the commit of the event.
        type: string
        default: ""
    outputs:
      key:
        description: The build key.
        value: ${{ jobs.prebuilt.outputs.key }}

jobs:
  prebuilt:
    name: Find Prebuilt
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE: server-prebuilt
    outputs:
      key: ${{ steps.key.outputs.key }}
      zig: ${{ steps.key.outputs.zig }}
      found: ${{ steps.prebuilt.outputs.found }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Key
        id: key
        run: |
          key="$(scripts/build-server.sh key)"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "zig=$(scripts/build-server.sh zig-version)" >> "$GITHUB_OUTPUT"
          echo "Server build key: $key" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Download the Prebuilt
        id: prebuilt
        if: inputs.prebuilt
        env:
          KEY: ${{ steps.key.outputs.key }}
        run: |
          found=false
          if scripts/build-server.sh download "$GITHUB_REPOSITORY" "$RELEASE" "$KEY" build/server; then
            found=true
          fi
          if [[ "$found" != true ]]; then
            echo "No complete prebuilt for $KEY. Building it."
            rm -rf build/server
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: steps.prebuilt.outputs.found == 'true'
        with:
          name: server
          path: build/server/
          if-no-files-found: error
          retention-days: 3

  build:
    name: Build
    needs: prebuilt
    if: needs.prebuilt.outputs.found != 'true'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE: server-prebuilt
      KEY: ${{ needs.prebuilt.outputs.key }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Select Xcode
        uses: ./.github/actions/select-xcode
        with:
          version: "26.3"

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ needs.prebuilt.outputs.zig }}

      # The key of this checkout must be the key of Find Prebuilt, because
      # the steps below use that key.
      - name: Build
        run: |
          test "$(scripts/build-server.sh key)" = "$KEY"
          scripts/build-server.sh build build/server

      # Never replaces an asset: an app that is out carries the checksums of
      # what the release serves. The tarballs carry the run in their names
      # (build-server.sh stage), so no two runs write the same asset, and a
      # run that stops in the middle leaves only tarballs that no manifest
      # names. The manifest goes last: the first manifest of a key is the
      # build of that key. A run whose manifest comes second removes its own
      # tarballs and takes the first build.
      - name: Upload the Prebuilt
        id: upload
        if: >-
          github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A second run can create it at the same time; then use theirs.
            gh release create "$RELEASE" --repo "$GITHUB_REPOSITORY" \
              --prerelease --latest=false --target main \
              --title "Server prebuilts" \
              --notes "Builds of server/ for scripts/setup.sh, named by build key. CI adds them. It keeps the builds of main, of open pull requests and of the last 14 days, and removes the others. They are not a release of Macterm." \
              || gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" > /dev/null
          fi
          staged="$RUNNER_TEMP/staged"
          rm -rf "$staged"
          scripts/build-server.sh stage build/server "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$staged"
          gh release upload "$RELEASE" --repo "$GITHUB_REPOSITORY" "$staged"/macterm-"$KEY"-*.tar.gz
          if ! gh release upload "$RELEASE" --repo "$GITHUB_REPOSITORY" \
              "$staged/macterm-$KEY-server.json" 2> upload.err; then
            if ! grep -qi "already exists" upload.err; then
              cat upload.err >&2
              exit 1
            fi
            echo "Another run uploaded the build of $KEY first. Removing this run's tarballs."
            for file in "$staged"/macterm-"$KEY"-*.tar.gz; do
              gh release delete-asset "$RELEASE" "$(basename "$file")" \
                --repo "$GITHUB_REPOSITORY" --yes ||
                echo "::warning::Cannot remove $(basename "$file")"
            done
          fi

      # The app bundles the builds of build/server, so they must be the bytes
      # that the release serves. When another run uploaded the key first,
      # take its whole build. The summary says if the two builds were the
      # same bytes.
      - name: Use the Served Build
        if: steps.upload.outcome == 'success'
        run: |
          served="$RUNNER_TEMP/served"
          rm -rf "$served"
          scripts/build-server.sh download "$GITHUB_REPOSITORY" "$RELEASE" "$KEY" "$served"
          sums() { jq -S '[.files[].sha256]' "$1/macterm-$KEY-server.json"; }
          if [[ "$(sums "$served")" == "$(sums build/server)" ]]; then
            echo "This build is the served build" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "The served build has other bytes; using it" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          rm -rf build/server
          cp -R "$served" build/server

      - uses: actions/upload-artifact@v7
        with:
          name: server
          path: build/server/
          if-no-files-found: error
          retention-days: 3
