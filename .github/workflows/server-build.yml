name: Server Build

# Builds the session server from server/ for every target that the app
# carries (scripts/build-server.sh: macOS universal, Linux x86_64 and aarch64)
# and gives the tarballs to the calling workflow as the artifact `server`. A
# job that builds the app downloads it into build/server before setup, and
# setup installs it from there.
#
# The build key is the hash of the server's sources (build-server.sh). Each
# build has a manifest, `macterm-<key>-server.json`, with the SHA-256 of each
# tarball; `build-server.sh verify` checks a build against it.
# With `prebuilt`, the job Prebuilt takes the build for the key from the
# `server-prebuilt` release when it is there, on a Linux runner, and the job
# Build does not run. So a commit that changes no server source takes no macOS
# runner. Without `prebuilt` (the release workflows), Build always builds from
# the commit.
#
# A build that this job made goes to the `server-prebuilt` release, so that
# setup on a Mac without Zig can download it. An asset is never replaced. A
# pull request from a fork has a read-only token and uploads nothing. Assets
# older than 90 days are removed, except the build of main's key.
#
# macos-26 with Xcode 26.3: lipo needs macOS, and zig cannot link with Xcode
# 26.4 or later (zig#31658). The macOS 27 runner has nothing older.

on:
  workflow_call:
    inputs:
      prebuilt:
        description: Take the prebuilt for the key when the release has it.
        type: boolean
        default: true
      ref:
        description: The commit to build. Empty means the commit of the event.
        type: string
        default: ""
    outputs:
      key:
        description: The build key.
        value: ${{ jobs.prebuilt.outputs.key }}

jobs:
  prebuilt:
    name: Prebuilt
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE: server-prebuilt
    outputs:
      key: ${{ steps.key.outputs.key }}
      zig: ${{ steps.key.outputs.zig }}
      found: ${{ steps.prebuilt.outputs.found }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Key
        id: key
        run: |
          key="$(scripts/build-server.sh key)"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "zig=$(scripts/build-server.sh zig-version)" >> "$GITHUB_OUTPUT"
          echo "Server build key: $key" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Download the Prebuilt
        id: prebuilt
        if: inputs.prebuilt
        env:
          KEY: ${{ steps.key.outputs.key }}
        run: |
          mkdir -p build/server
          found=false
          if gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" \
              --dir build/server --pattern "macterm-$KEY-*" &&
            scripts/build-server.sh verify build/server "$KEY"; then
            found=true
          fi
          if [[ "$found" != true ]]; then
            echo "No complete prebuilt for $KEY. Building it."
            rm -rf build/server
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: steps.prebuilt.outputs.found == 'true'
        with:
          name: server
          path: build/server/
          if-no-files-found: error
          retention-days: 3

  build:
    name: Build
    needs: prebuilt
    if: needs.prebuilt.outputs.found != 'true'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE: server-prebuilt
      KEY: ${{ needs.prebuilt.outputs.key }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/select-xcode
        with:
          version: "26.3"

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ needs.prebuilt.outputs.zig }}

      # The build computes the key again from its own checkout. The upload
      # below takes the files of the key of Prebuilt, so a different key
      # fails there.
      - name: Build
        run: scripts/build-server.sh build build/server

      # Never replaces an asset: an app that is out carries the checksums of
      # what the release serves. Two runs of one key can both build it;
      # the second finds the first's assets and keeps them.
      - name: Upload the Prebuilt
        id: upload
        if: >-
          github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A second run can create it at the same time; then use theirs.
            gh release create "$RELEASE" --repo "$GITHUB_REPOSITORY" \
              --prerelease --latest=false --target main \
              --title "Server prebuilts" \
              --notes "Builds of server/ for scripts/setup.sh, named by build key. CI adds them and removes them after 90 days. They are not a release of Macterm." \
              || gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" > /dev/null
          fi
          # The manifest goes last: a build in the release is complete once
          # its manifest is there.
          for file in build/server/macterm-"$KEY"-*.tar.gz build/server/macterm-"$KEY"-server.json; do
            if ! gh release upload "$RELEASE" --repo "$GITHUB_REPOSITORY" "$file" 2> upload.err; then
              if grep -qi "already exists" upload.err; then
                echo "$(basename "$file") is already in the release"
              else
                cat upload.err >&2
                exit 1
              fi
            fi
          done

      # The app bundles the builds of build/server, so they must be the bytes
      # that the release serves. When another run uploaded the key first,
      # take its whole build. The summary says if the two builds were the
      # same bytes.
      - name: Use the Served Build
        if: steps.upload.outcome == 'success'
        run: |
          served="$RUNNER_TEMP/served"
          rm -rf "$served"
          mkdir -p "$served"
          gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --dir "$served" \
            --pattern "macterm-$KEY-*"
          scripts/build-server.sh verify "$served" "$KEY"
          if cmp -s "$served/macterm-$KEY-server.json" "build/server/macterm-$KEY-server.json"; then
            echo "This build is the served build" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "The served build has other bytes; using it" | tee -a "$GITHUB_STEP_SUMMARY"
            rm -rf build/server
            cp -R "$served" build/server
          fi

      # Keeps main's current key at any age: setup on main downloads it.
      - name: Remove Old Prebuilts
        if: steps.upload.outcome == 'success'
        run: |
          git fetch --depth=1 origin main
          main_key="$(scripts/build-server.sh key-of FETCH_HEAD)"
          cutoff="$(date -u -v-90d +%Y-%m-%dT%H:%M:%SZ)"
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE" --jq .id)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
            --jq ".[] | select(.created_at < \"$cutoff\") | \"\(.id) \(.name)\"" |
            while read -r id name; do
              case "$name" in macterm-"$main_key"-*) continue ;; esac
              echo "Removing $name"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
            done

      - uses: actions/upload-artifact@v7
        with:
          name: server
          path: build/server/
          if-no-files-found: error
          retention-days: 3
