name: Checks

# Style gates only — the test suites live in test.yml (named so checks group
# as "Test / Unit" and "Test / End-to-End" in the PR UI).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels the runs of its older commit, so they
# do not keep the macOS runners that the new jobs need. A push to main has a
# group for each commit and is never cancelled: release-tip.yml needs the Test
# and Checks results of each commit on main.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # The path areas of .github/path-areas that this commit changes.
  changes:
    name: Detect Changes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      style: ${{ steps.changes.outputs.style }}
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 2
      - name: Find Changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: scripts/changed-areas.sh

  format:
    name: Format
    needs: changes
    if: needs.changes.outputs.style == 'true'
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v5.2.8

      - name: Format
        run: mise run format --check --verbose

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.style == 'true'
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v5.2.8

      - name: Lint
        run: mise run lint --verbose

  # Each symbol and path that an AGENTS.md names exists in the tree. It runs on
  # every commit, because a change to any file can remove a name.
  agents:
    name: Agents Map
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - name: Check Agents Map
        run: python3 scripts/check-agents.py
