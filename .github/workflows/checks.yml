name: Checks

# Style gates only — the test suites live in test.yml (named so checks group
# as "Test / Unit" and "Test / End-to-End" in the PR UI).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push cancels the runs of the older commit of the same ref: of a pull
# request, and of main too. Only the newest commit of main matters, so the
# runs of older main commits do not keep the macOS runners that it needs. A
# cancelled main commit gets no tip build (release-tip.yml), and its changes
# get their checks in the run of the next commit (scripts/changed-areas.sh).
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The path areas of .github/path-areas that this commit changes.
  changes:
    name: Detect Changes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # actions: read lists the runs of this workflow (scripts/changed-areas.sh).
    permissions:
      contents: read
      actions: read
    outputs:
      style: ${{ steps.changes.outputs.style }}
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 2
      - name: Find Changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/changed-areas.sh

  format:
    name: Format
    needs: changes
    if: needs.changes.outputs.style == 'true'
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v5.2.10

      - name: Format
        run: mise run format --check --verbose

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.style == 'true'
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v5.2.10

      - name: Lint
        run: mise run lint --verbose

  # Each symbol and path that an AGENTS.md names exists in the tree. It runs on
  # every commit, because a change to any file can remove a name.
  agents:
    name: Agents Map
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - name: Check Agents Map
        run: python3 scripts/check-agents.py
