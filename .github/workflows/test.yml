name: Test

# All testing CI lives here so check names group in the PR UI as
# "Test / Unit" and "Test / End-to-end" (the workflow name is the prefix;
# the job name is the required-status-check context). Style gates stay in
# checks.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels the runs of its older commit, so they
# do not keep the macOS runners that the new jobs need. A push to main has a
# group for each commit and is never cancelled: release-tip.yml needs the Test
# and Checks results of each commit on main.
concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # The path areas of .github/path-areas that this commit changes.
  changes:
    name: Detect changes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      app: ${{ steps.changes.outputs.app }}
      extensions: ${{ steps.changes.outputs.extensions }}
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 2
      - name: Find Changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: scripts/changed-areas.sh

  # The session server that the app bundles, built from server/ at this
  # commit or taken from its prebuilt (server-build.yml). Every job that
  # builds the app downloads it into build/server before setup.
  server:
    name: Server
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.extensions == 'true'
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/server-build.yml

  unit:
    name: Unit
    needs: [changes, server]
    # !cancelled(), not the default success(): a failed server build must
    # fail this job (at the artifact download), not skip it. A skipped job
    # passes a required check.
    if: >-
      !cancelled()
      && (needs.changes.outputs.app == 'true' || needs.changes.outputs.extensions == 'true')
    runs-on: xcode-27
    env:
      # Xcode passes only TEST_RUNNER_ variables to the test host. The tests
      # that read the docs fail, and do not skip, when CI is set and the
      # checkout of macterm/website is missing (WebsiteDocs).
      TEST_RUNNER_CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The docs pages are in the website repository. DocsLinkTests,
      # TextFileDefaultsTests and CustomPaletteFileTests read them from
      # ./website (WebsiteDocs).
      # The website branch with the same name as this branch, if there is one,
      # so that a feature and its docs pass together. Otherwise main.
      - name: Pick the Website Ref
        id: website-ref
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          ref=main
          if [[ -n "$BRANCH" ]] && gh api "repos/macterm/website/branches/$BRANCH" --silent 2>/dev/null; then
            ref="$BRANCH"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check Out the Website
        uses: actions/checkout@v7
        with:
          repository: macterm/website
          ref: ${{ steps.website-ref.outputs.ref }}
          path: website

      - name: App Setup
        id: setup
        uses: ./.github/actions/app-setup

      # Debug build products, keyed on the GhosttyKit ACTUALLY INSTALLED above,
      # so they can never be paired with a framework they weren't compiled
      # against.
      #
      # A PINNED RELEASE IS NOT IMMUTABLE — that's what makes the framework hash
      # load-bearing rather than belt-and-braces. macterm/ghostty replaced
      # build-2026-08-02's assets at 08:32Z, hours after CI had cached the
      # earlier bytes under that same tag. The GhosttyKit key rolls weekly with
      # no restore-keys, so when the ISO week turned over the next run
      # re-downloaded the identical tag and got DIFFERENT bytes, while a broad
      # `derived-debug-` restore-key handed the build a GhosttyKit .pcm
      # precompiled against the old header (macterm#208, run 30790705828):
      #
      #   error: file '.../include/ghostty.h' has been modified since the module
      #   file '.../GhosttyKit-<hash>.pcm' was built
      #   note: precompiled file '...pcm' needs to be rebuilt
      #
      # Two properties of that failure are worth keeping in mind here. Only the
      # test target broke — the app target got rebuilt, so the e2e job in the
      # same run passed and the signal looked like a test-only problem. And the
      # poisoned .pcm was restored *and re-saved* on every attempt, so
      # `gh run rerun` reproduced it exactly; clearing it took deleting every
      # derived-debug-* entry by hand. So a stale cache can break the build
      # outright, not merely slow it down (this step used to claim otherwise),
      # and the fallback keys must never reach across a framework change.
      #
      # The hash can only be taken after setup — it's the *downloaded*
      # framework — which is why this is a restore/save split instead of one
      # `cache` step. It also can't be hoisted into a job-level `env`: that
      # evaluates before any step runs and would hash nothing. The glob stays
      # slice-agnostic for the reason setup.sh globs rather than naming a slice.
      #
      # Header only, not the whole xcframework: ghostty.h is the input a .pcm
      # records and therefore the one whose change hard-fails the build, while
      # hashing the per-slice static archives would add hundreds of MB of
      # hashing to every job to catch a stale *relink* — which xcodebuild
      # already handles, tracking the archives as link inputs.

      # The Xcode version leads the key for the same reason the framework hash
      # is in it: .swiftmodule/.pcm products record the compiler that wrote
      # them, so restoring products built by a different Swift across a pin
      # bump is the "module file was built by a different version" flavour of
      # the incident above. The pin makes that version knowable, and having it
      # in the key is what keeps a bump from silently inheriting the old
      # toolchain's output. Bumping it starts one cold build, which is fine —
      # a cold cache only costs time; a stale one breaks the build.
      - name: Restore DerivedData (Debug)
        id: derived
        uses: actions/cache/restore@v6
        with:
          path: build/DerivedData
          key: derived-debug-xcode${{ steps.setup.outputs.xcode-version }}-${{ hashFiles('GhosttyKit.xcframework/*/Headers/ghostty.h') }}-${{ hashFiles('**/*.swift', 'project.yml') }}-${{ github.run_id }}
          restore-keys: |
            derived-debug-xcode${{ steps.setup.outputs.xcode-version }}-${{ hashFiles('GhosttyKit.xcframework/*/Headers/ghostty.h') }}-${{ hashFiles('**/*.swift', 'project.yml') }}-
            derived-debug-xcode${{ steps.setup.outputs.xcode-version }}-${{ hashFiles('GhosttyKit.xcframework/*/Headers/ghostty.h') }}-

      - name: Test
        run: mise run test --verbose

      # The test build wrote the strings of every Swift file. The catalog
      # must hold exactly those strings, so a new UI string cannot ship
      # without its entry (and its translations).
      - name: String Catalog
        run: mise run strings --check --no-build --verbose

      # Saves under the key resolved at restore time, NOT a re-evaluated
      # expression — `**/*.swift` would otherwise pick up whatever the build
      # just wrote under build/DerivedData. Success-only (the default `if`), so
      # a failed build never persists its products for the next run to inherit.
      # The sibling e2e job saves this same key; the loser of that race gets a
      # harmless "cache already exists" warning.
      - name: Save DerivedData (Debug)
        uses: actions/cache/save@v6
        with:
          path: build/DerivedData
          key: ${{ steps.derived.outputs.cache-primary-key }}

  # End-to-end: build the Debug app, launch it hermetically (the
  # TCC-free recipe — Darwin notifications + LaunchServices activation, see
  # scripts/_harness.py), and drive it through the bundled `macterm` CLI's
  # control socket, asserting on libghostty's own state (`pane dump`/`list`).
  # A separate job from `unit` so the slower GUI run never delays the fast
  # unit signal and failures are attributable at a glance.
  e2e:
    name: End-to-end
    needs: [changes, server]
    # !cancelled(): see the unit job.
    if: ${{ !cancelled() && needs.changes.outputs.app == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: App Setup
        id: setup
        uses: ./.github/actions/app-setup

      # Shares the unit job's Debug DerivedData namespace — same configuration,
      # same on-disk path, so the same framework-hash key (see the unit job for
      # why that hash is load-bearing and why it has to be read after setup).
      # This job is how the incident spread: it builds only the app target, so
      # it succeeded while carrying forward the stale test-target .pcm it never
      # touched, and its save re-published the poison under a fresh key.
      - name: Restore DerivedData (Debug)
        id: derived
        uses: actions/cache/restore@v6
        with:
          path: build/DerivedData
          key: derived-debug-xcode${{ steps.setup.outputs.xcode-version }}-${{ hashFiles('GhosttyKit.xcframework/*/Headers/ghostty.h') }}-${{ hashFiles('**/*.swift', 'project.yml') }}-${{ github.run_id }}
          restore-keys: |
            derived-debug-xcode${{ steps.setup.outputs.xcode-version }}-${{ hashFiles('GhosttyKit.xcframework/*/Headers/ghostty.h') }}-${{ hashFiles('**/*.swift', 'project.yml') }}-
            derived-debug-xcode${{ steps.setup.outputs.xcode-version }}-${{ hashFiles('GhosttyKit.xcframework/*/Headers/ghostty.h') }}-

      - name: End-to-end tests
        run: mise run e2e --verbose

      # Screenshot, unified log, and per-pane terminal text captured by the
      # suite's failure fixtures (scripts/e2e/conftest.py).
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics
          path: build/e2e/diagnostics/
          if-no-files-found: ignore

      - name: Save DerivedData (Debug)
        uses: actions/cache/save@v6
        with:
          path: build/DerivedData
          key: ${{ steps.derived.outputs.cache-primary-key }}

  # The release build itself, from the recipe that release.yml and
  # release-tip.yml use (.github/actions/build-release): a universal Release
  # archive and a DMG from scripts/build.sh. With no secrets, so it is ad-hoc
  # signed, has the Sparkle placeholder key and is never published. A release
  # always builds again from its own commit; this only proves that it can.
  release-build:
    name: Release Build
    needs: [changes, server]
    # !cancelled(): see the unit job.
    if: ${{ !cancelled() && needs.changes.outputs.app == 'true' }}
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The version counts commits since the last vX.Y.Z tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Version
        id: version
        run: |
          source scripts/_lib.sh
          echo "version=$(macterm_tip_version)" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: ./.github/actions/build-release
        with:
          version: ${{ steps.version.outputs.version }}
          distribute: "false"

      # ditto keeps the bundle's symlinks and signature, which a plain zip of
      # the folder does not.
      - name: Pack the App
        run: ditto -c -k --keepParent build/export/Macterm.app build/macterm-release.zip

      - uses: actions/upload-artifact@v7
        with:
          name: macterm-release-app
          path: build/macterm-release.zip
          retention-days: 3

  # Every other macOS job runs on the newest macOS with the pinned Xcode, so
  # nothing else runs the app on an older system. This starts the Release
  # build on older runners (scripts/older-macos-smoke.sh): it must launch
  # there, and on macOS 26 it must paint its adaptive icon through the
  # private renderer.
  #
  # Two jobs, not a matrix: both checks are required, and a skipped matrix job
  # reports the unexpanded name `Smoke (${{ matrix.runner }})`. A required
  # `Smoke (macos-26)` would then never report on a pull request that changes
  # no Swift, and that pull request could never merge.
  #
  # macos-26: the private renderer of the adaptive icon. macos-15: the launch
  # of an app built with a newer SDK, below macOS 26. (macos-14 is being
  # retired on GitHub; 15 is the oldest image to keep.)
  smoke-macos-26:
    name: Smoke (macos-26)
    needs: release-build
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: macterm-release-app

      - name: Unpack the App
        run: ditto -x -k macterm-release.zip build

      - name: Smoke Test
        run: scripts/older-macos-smoke.sh build/Macterm.app

  smoke-macos-15:
    name: Smoke (macos-15)
    needs: release-build
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: macterm-release-app

      - name: Unpack the App
        run: ditto -x -k macterm-release.zip build

      - name: Smoke Test
        run: scripts/older-macos-smoke.sh build/Macterm.app
